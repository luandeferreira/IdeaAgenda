<div class="idea-agenda">
  <header class="topbar">
    <a routerLink="/" class="brand" aria-label="IdeaAgenda - início">
      <img src="assets/logo.png" alt="" class="brand-logo" />
      <span class="logo">IdeaAgenda</span>
    </a>

    @if (auth.user(); as user) {
      <nav class="topbar-nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Tarefas</a>
        @if (user.is_admin) {
          <a routerLink="/admin" routerLinkActive="active">Painel do dono</a>
        }
        <span class="user-chip" [title]="user.email">
          @if (user.picture) {
            <img [src]="user.picture" alt="" referrerpolicy="no-referrer" />
          } @else {
            <span class="avatar">{{ (user.name || user.email).charAt(0).toUpperCase() }}</span>
          }
          <span class="user-name">{{ user.name || user.email }}</span>
        </span>
        <button type="button" class="btn btn-ghost btn-sm" (click)="auth.logout()">Sair</button>
      </nav>
    }
  </header>

  <main class="container">
    <router-outlet />
  </main>

  <footer class="footer">
    <p>IdeaAgenda © {{ year }} · Desenvolvido com <span>♥</span> por Luan Ferreira e João Gabriel</p>
    <a href="https://github.com/luanferreiradev/IdeaAgenda" target="_blank" rel="noopener">GitHub</a>
  </footer>
</div>
